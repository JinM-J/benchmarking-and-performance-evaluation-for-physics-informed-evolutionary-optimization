    maxgen: 100
    init_points: 10
    update_interval: 10
    hf_points_per_update: 3
    penalty_min: 10.0
    penalty_max: 100.0
    hf_query_budget: 40
    method_params:
      inner_gens: 200
      stagnation_limit: 5
    mse_grid_nx: 100
    mse_grid_nt: 100
    update_policy:
      type: periodic_topk
    surrogates:
      gp:
        length_scale_bounds:
        - 0.001
        - 100.0
        white_kernel: 1.0e-08
      pigp:
        length_scale_bounds:
        - 0.001
        - 100.0
        white_kernel: 1.0e-05
        n_collocation: 100
        collocation_noise: 0.01
      pinn:
        layers:
        - 2
        - 80
        - 80
        - 80
        - 80
        - 1
        ever_epochs: 300
        ic_points: 500
        bc_points: 500
        res_points: 10000
        lr_max: 0.008
        lr_min: 1.0e-06
        lr: 0.008
        data_weight: 5.0
